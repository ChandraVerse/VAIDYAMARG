version: '3.9'

# Development override — hot reload, debug ports, no nginx
services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  backend:
    build:
      target: development
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - '3000:3000'
      - '9229:9229'   # Node.js debugger

  ai-service:
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      ENVIRONMENT: development
    volumes:
      - ./ai-service:/app
    ports:
      - '8001:8001'
