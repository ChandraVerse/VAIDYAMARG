version: '3.9'

services:

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-vaidyamarg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB:       ${POSTGRES_DB:-vaidyamarg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vaidyamarg}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vm_net

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redispass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vm_net

  # ─────────────────────────────────────────
  # Python OCR Service
  # ─────────────────────────────────────────
  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: vm_ocr
    restart: unless-stopped
    environment:
      PORT: 8000
    ports:
      - '8000:8000'
    networks:
      - vm_net

  # ─────────────────────────────────────────
  # NestJS Backend API
  # ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vm_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_started
    environment:
      NODE_ENV:            production
      PORT:                3000
      DATABASE_URL:        postgresql://${POSTGRES_USER:-vaidyamarg}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-vaidyamarg}
      REDIS_URL:           redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      JWT_SECRET:          ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RAZORPAY_KEY_ID:       ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET:   ${RAZORPAY_KEY_SECRET}
      TWILIO_ACCOUNT_SID:    ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN:     ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER:   ${TWILIO_PHONE_NUMBER}
      OCR_SERVICE_URL:       http://ocr:8000
    ports:
      - '3000:3000'
    networks:
      - vm_net

  # ─────────────────────────────────────────
  # Admin Panel (Nginx-served static build)
  # ─────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: vm_admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:80'
    networks:
      - vm_net

volumes:
  postgres_data:
  redis_data:

networks:
  vm_net:
    driver: bridge
