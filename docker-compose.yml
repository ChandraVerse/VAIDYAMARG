version: '3.9'

services:

  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-vaidyamarg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB:       ${POSTGRES_DB:-vaidyamarg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vaidyamarg}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vm_net

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redispass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vm_net

  # ─────────────────────────────────────────────
  # Python OCR Service
  # ─────────────────────────────────────────────
  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: vm_ocr
    restart: unless-stopped
    environment:
      PORT:            8000
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    ports:
      - '8000:8000'
    networks:
      - vm_net

  # ─────────────────────────────────────────────
  # NestJS Backend API
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vm_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_started
    environment:
      NODE_ENV:            production
      PORT:                3000

      # Database
      DATABASE_URL:        postgresql://${POSTGRES_USER:-vaidyamarg}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-vaidyamarg}
      REDIS_URL:           redis://:${REDIS_PASSWORD:-redispass}@redis:6379

      # Auth
      JWT_SECRET:          ${JWT_SECRET}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN:      ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Payments
      RAZORPAY_KEY_ID:       ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET:   ${RAZORPAY_KEY_SECRET}

      # OTP / SMS — MSG91 (https://msg91.com)
      # otp.service.ts calls the MSG91 v5 API.
      # Do NOT add TWILIO_* variables here — Twilio is not used.
      MSG91_AUTH_KEY:        ${MSG91_AUTH_KEY}
      MSG91_TEMPLATE_ID:     ${MSG91_TEMPLATE_ID}
      MSG91_SENDER_ID:       ${MSG91_SENDER_ID:-VDYMRG}

      # Firebase Cloud Messaging (push notifications)
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}

      # OCR microservice
      OCR_SERVICE_URL:       http://ocr:8000
      INTERNAL_SECRET:       ${INTERNAL_SECRET}

      # CORS
      CORS_ORIGINS:          ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
    ports:
      - '3000:3000'
    networks:
      - vm_net

  # ─────────────────────────────────────────────
  # Admin Panel (Nginx-served static build)
  # ─────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: vm_admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:80'
    networks:
      - vm_net

volumes:
  postgres_data:
  redis_data:

networks:
  vm_net:
    driver: bridge
