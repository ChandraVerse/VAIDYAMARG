name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on v1.0.0, v1.2.3, etc.

env:
  REGISTRY:      ghcr.io
  IMAGE_PREFIX:  ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Build, push & create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create Release
      packages: write   # to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for changelog generation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # Build + push backend
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context:   ./backend
          push:      true
          target:    production
          tags: |
            ${{ env.IMAGE_PREFIX }}/vaidyamarg-api:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}/vaidyamarg-api:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

      # Build + push admin
      - name: Build & push Admin image
        uses: docker/build-push-action@v5
        with:
          context:   ./admin
          push:      true
          tags: |
            ${{ env.IMAGE_PREFIX }}/vaidyamarg-admin:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}/vaidyamarg-admin:latest
          cache-from: type=gha,scope=admin
          cache-to:   type=gha,scope=admin,mode=max

      # Create GitHub Release with auto-generated notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:            ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## Docker Images

            Pull the latest release images from GHCR:

            ```bash
            # Backend API
            docker pull ghcr.io/${{ github.repository_owner }}/vaidyamarg-api:${{ steps.version.outputs.VERSION }}

            # Admin Panel
            docker pull ghcr.io/${{ github.repository_owner }}/vaidyamarg-admin:${{ steps.version.outputs.VERSION }}
            ```

            > All services: run `docker compose up -d` with the `.env` file populated.
