name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend (NestJS)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     vaidyamarg
          POSTGRES_PASSWORD: vaidyamarg
          POSTGRES_DB:       vaidyamarg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://vaidyamarg:vaidyamarg@localhost:5432/vaidyamarg_test

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://vaidyamarg:vaidyamarg@localhost:5432/vaidyamarg_test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://vaidyamarg:vaidyamarg@localhost:5432/vaidyamarg_test
          REDIS_URL:    redis://localhost:6379
          JWT_SECRET:   ci_test_secret
          NODE_ENV:     test

  # ---------------------------------------------------------------------------
  # OCR Service (Python)
  # ---------------------------------------------------------------------------
  ocr:
    name: OCR Service — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr-service/requirements.txt

      - name: Install Tesseract
        run: sudo apt-get install -y tesseract-ocr

      - run: pip install -r requirements.txt pytest

      - name: Pytest
        run: pytest ocr/tests/ -v --tb=short
        env:
          OCR_ENGINE:      tesseract
          INTERNAL_SECRET: ci_test_secret
          BACKEND_URL:     http://localhost:3000

  # ---------------------------------------------------------------------------
  # Admin Dashboard (Vite + React)
  # ---------------------------------------------------------------------------
  admin:
    name: Admin Dashboard — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run build
