# ============================================================
# VaidyaMarg — CI (Pull Request Gate)
# Runs on every PR to main and every push to main.
# Jobs run in parallel; all must pass before merge.
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 1. BACKEND  — NestJS + Prisma
  # ------------------------------------------------------------
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       vaidyamarg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL:        postgresql://test:test@localhost:5432/vaidyamarg_test
      REDIS_URL:           redis://localhost:6379
      JWT_SECRET:          ci-test-secret-32-chars-minimum!!
      JWT_REFRESH_SECRET:  ci-test-refresh-32-chars-minimum!
      TWILIO_ACCOUNT_SID:  ACtest
      TWILIO_AUTH_TOKEN:   testtoken
      TWILIO_PHONE_NUMBER: "+15005550006"
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY:    test
      CLOUDINARY_API_SECRET: test
      RAZORPAY_KEY_ID:       test
      RAZORPAY_KEY_SECRET:   test
      FIREBASE_PROJECT_ID:   test
      NODE_ENV:              test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations (test DB)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test -- --passWithNoTests --ci

      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/vaidyamarg_test

  # ------------------------------------------------------------
  # 2. ADMIN  — Vite + React
  # ------------------------------------------------------------
  admin:
    name: Admin (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.vaidyamarg.in

  # ------------------------------------------------------------
  # 3. MOBILE  — Expo (type-check only; no simulator in CI)
  # ------------------------------------------------------------
  mobile:
    name: Mobile (Expo TypeCheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ------------------------------------------------------------
  # 4. OCR SERVICE  — Python FastAPI
  # ------------------------------------------------------------
  ocr:
    name: OCR Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ocr-service/requirements.txt

      - name: Install system deps (Tesseract)
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check .
        continue-on-error: true   # non-blocking until ruff is added to requirements

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        continue-on-error: true   # non-blocking until tests exist
