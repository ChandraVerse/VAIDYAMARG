name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — lint, type-check, unit tests
  # ──────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     vaidyamarg_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB:       vaidyamarg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV:     test
      DATABASE_URL: postgresql://vaidyamarg_test:testpass@localhost:5432/vaidyamarg_test
      REDIS_URL:    redis://localhost:6379
      JWT_SECRET:   ci-test-secret-do-not-use-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations (test DB)
        run: npx prisma migrate deploy

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --passWithNoTests --forceExit

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Admin panel — type-check + build
  # ──────────────────────────────────────────────────────────────────────────
  admin-ci:
    name: Admin Panel (Vite + React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Mobile — type-check only (no emulator needed in CI)
  # ──────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: Mobile (React Native / Expo)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────────────────────
  # Docker build smoke-test (no push, just verify images build)
  # ──────────────────────────────────────────────────────────────────────────
  docker-build-check:
    name: Docker build smoke-test
    runs-on: ubuntu-latest
    needs: [backend-ci, admin-ci]
    # Only run on PRs to main — saves CI minutes on every push
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: vaidyamarg/api:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build admin image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: false
          tags: vaidyamarg/admin:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max
