# ============================================================
# VaidyaMarg — Docker Build & Publish to GHCR
# Triggers on:
#   - push to main  (tag: ghcr.io/owner/service:latest)
#   - semver tags   (tag: ghcr.io/owner/service:v1.2.3 + :latest)
# ============================================================
name: Docker Publish

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']

env:
  REGISTRY: ghcr.io
  # lowercase owner is required by GHCR
  OWNER: ${{ github.repository_owner }}

jobs:
  build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - service: admin
            context: ./admin
            dockerfile: ./admin/Dockerfile

          - service: ocr-service
            context: ./ocr-service
            dockerfile: ./ocr-service/Dockerfile

          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/vaidyamarg-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}
          platforms:  linux/amd64,linux/arm64
