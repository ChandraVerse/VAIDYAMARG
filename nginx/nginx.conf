worker_processes auto;
events { worker_connections 1024; }

http {
  # ─── Security Headers ──────────────────────────────────────────────────
  add_header X-Frame-Options           DENY;
  add_header X-Content-Type-Options    nosniff;
  add_header X-XSS-Protection          "1; mode=block";
  add_header Referrer-Policy           "strict-origin-when-cross-origin";
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

  # ─── Rate Limiting ─────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # ─── Gzip ──────────────────────────────────────────────────────────────
  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_min_length 1000;

  # ─── Upstreams ─────────────────────────────────────────────────────────
  upstream backend_api {
    server backend:3000;
    keepalive 32;
  }

  upstream ocr_service {
    server ocr-service:8000;
    keepalive 8;
  }

  upstream ai_service {
    server ai-service:8001;
  }

  # ─── HTTP → HTTPS Redirect ─────────────────────────────────────────────
  server {
    listen 80;
    server_name vaidyamarg.in www.vaidyamarg.in;
    return 301 https://$host$request_uri;
  }

  # ─── Main Server Block ─────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name vaidyamarg.in www.vaidyamarg.in;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;  # prescription image uploads

    # ── Socket.io (/orders namespace) ──────────────────────────────────
    # Must come BEFORE the generic /api/ block so it is matched first.
    # No rate limiting — connections are long-lived WebSockets.
    # proxy_read_timeout 1h keeps idle WS connections alive.
    location /socket.io/ {
      proxy_pass         http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout  3600s;  # 1 hour — keep WS connection alive
      proxy_send_timeout  3600s;
    }

    # ── Auth Routes — stricter rate limit ───────────────────────────────
    location /api/v1/auth/ {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass         http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── OCR Service ─────────────────────────────────────────────────────
    location /ocr/ {
      proxy_pass         http://ocr_service/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      client_max_body_size 20M;  # large prescription images for OCR
    }

    # ── General API Routes ───────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass         http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Health check ────────────────────────────────────────────────────
    location /health {
      proxy_pass http://backend_api;
      access_log off;
    }

    # ── Swagger docs (disable in production if desired) ──────────────────
    location /api/docs {
      proxy_pass http://backend_api;
    }
  }
}
